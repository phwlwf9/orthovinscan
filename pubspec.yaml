name: orthoai
description: Offline clinician-guided orthopaedic research and education application.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  camera: ^0.11.3
  image: ^4.5.4
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/clinical_rules/
    - assets/fonts/
